version: v2

plugins:
  - local: ../../bin/protoc-gen-go
    out: ../../shared/pkg/proto
    opt:
      - paths=source_relative
  - local: ../../bin/protoc-gen-go-grpc
    out: ../../shared/pkg/proto
    opt:
      - paths=source_relative
  - local: ../../bin/protoc-gen-grpc-gateway
    out: ../../shared/pkg/proto
    opt:
      - paths=source_relative

  - plugin: buf.build/protocolbuffers/descriptor
    out: inventory_descriptor.pb
    opt: include_imports,include_source_info
