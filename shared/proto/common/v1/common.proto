syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vipshark78/microservices-course-homeworks/shared/pkg/proto/common/v1;common_v1";

// Session данные о сессии пользователя.
message Session {
  string uuid = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// NotificationMethod метод уведомлений.
message NotificationMethod {
  string provider_name = 1;
  string target = 2;
}

// UserInfo информация о пользователе.
message UserInfo {
  string login = 1;
  string email = 2;
  repeated NotificationMethod notification_methods = 3;
}

// User данные пользователя.
message User {
  string uuid = 1;
  UserInfo info = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}
