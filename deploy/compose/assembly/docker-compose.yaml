services: # Раздел, в котором описываются все контейнеры, необходимые для Assembly-сервиса
  # Assembly сервер
  assembly-server:
    build:
      context: ../../..
      dockerfile: deploy/docker/assembly/Dockerfile
    container_name: assembly-server
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep '[a]pp-assembly' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - microservices-net

networks: # Определение используемой сети
  microservices-net:
    external: true
    # Мы не создаём новую сеть, а подключаемся к внешней, общей для всех микросервисов
    # Её должен создать docker-compose.yml или вручную: docker network create microservices-net
