# ===============================
# ENVOY PROXY КОНФИГУРАЦИЯ ДЛЯ API GATEWAY
# HTTP ↔ HTTP для OrderService и HTTP ↔ gRPC для InventoryService
# С аутентификацией через IAM ext_authz
# ===============================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8081

static_resources:
  listeners:
  - name: api_gateway_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: api_gateway
          
          # ===============================
          # МАРШРУТИЗАЦИЯ
          # ===============================
          route_config:
            name: api_routes
            virtual_hosts:
            - name: api_service
              domains: ["*"]
              
              # CORS настройки
              cors:
                allow_origin_string_match:
                - prefix: "*"
                allow_methods: GET, PUT, DELETE, POST, OPTIONS
                allow_headers: keep-alive,user-agent,cache-control,content-type,authorization,session-uuid,x-session-uuid,x-session-id,cookie
                max_age: "1728000"
                expose_headers: x-user-uuid,x-user-login,x-user-email,x-session-uuid,grpc-status,grpc-message
              
              routes:
              # ===============================
              # ПУБЛИЧНЫЕ ЭНДПОИНТЫ (без аутентификации)
              # ===============================
              
              # Health check эндпоинты
              - match:
                  path: "/healthz"
                route:
                  cluster: iam_grpc_cluster
                  timeout: 5s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              
              - match:
                  path: "/health"
                route:
                  cluster: order_http_cluster
                  timeout: 5s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              
              # Публичные эндпоинты аутентификации (login и register)
              # Эти эндпоинты должны быть доступны без аутентификации
              # Примечание: если эти эндпоинты проксируются через Envoy,
              # они должны быть исключены из ext_authz
              # В текущей архитектуре они доступны напрямую через IAM gRPC сервис
              # и не проходят через Envoy, поэтому исключения не требуются
              
              # ===============================
              # ORDER SERVICE (HTTP↔HTTP)
              # ===============================
              # Проксируем все запросы под /order на OrderService без изменений протокола
              - match:
                  prefix: "/order"
                route:
                  cluster: order_http_cluster
                  timeout: 30s
                  # Убираем префикс /order перед отправкой в OrderService
                  # OrderService ожидает пути вида /api/v1/orders
                  # Если клиент отправляет /order/api/v1/orders, то после prefix_rewrite получится /api/v1/orders
                  # Используем regex_rewrite для правильного удаления префикса
                  regex_rewrite:
                    pattern:
                      regex: "^/order(.*)"
                    substitution: "\\1"
              
              # ===============================
              # INVENTORY SERVICE (HTTP↔gRPC через транскодер)
              # ===============================
              # Транскодируем HTTP запросы в gRPC для InventoryService
              # ВАЖНО: транскодер работает с исходным путем запроса и сопоставляет его с путями в proto
              # Поэтому пути в proto должны совпадать с путями запроса
              # Мы используем пути с префиксом /inventory в proto, поэтому не используем rewrite
              - match:
                  prefix: "/inventory"
                route:
                  cluster: inventory_grpc_cluster
                  timeout: 30s
                  # НЕ используем rewrite, так как пути в proto уже содержат префикс /inventory
                  # Транскодер сопоставит путь /inventory/v1/parts:list с путем в proto /inventory/v1/parts:list
              
              # ===============================
              # FALLBACK МАРШРУТ
              # ===============================
              - match:
                  prefix: "/"
                direct_response:
                  status: 404
                  body:
                    inline_string: |
                      {
                        "error": "Not Found",
                        "message": "Available endpoints:",
                        "endpoints": {
                          "order": "/order/api/v1/orders",
                          "inventory": "/inventory/v1/parts",
                          "public": {
                            "login": "/v1/login",
                            "register": "/v1/register",
                            "health": "/healthz, /health"
                          }
                        }
                      }

          # ===============================
          # HTTP ФИЛЬТРЫ (ПОРЯДОК КРИТИЧЕН!)
          # ===============================
          http_filters:
          
          # 1. CORS фильтр - ПЕРВЫЙ
          # Добавляет CORS заголовки для веб-приложений
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          
          # 2. ⚠️ EXTERNAL AUTHORIZATION (gRPC) - ВТОРОЙ
          # Аутентификация всех защищённых маршрутов через IAM
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              
              # Используем gRPC сервис IAM для авторизации
              grpc_service:
                envoy_grpc:
                  cluster_name: iam_grpc_cluster
                timeout: 2s
              
              # Запрещать доступ если auth сервис недоступен (безопасность)
              failure_mode_allow: false
              
              # Включать тело запроса в авторизацию (для POST/PUT)
              with_request_body:
                max_request_bytes: 8192
                allow_partial_message: true
                pack_as_bytes: false
              
              # Заголовки, которые отправляем в auth service
              allowed_headers:
                patterns:
                  - exact: "authorization"
                  - exact: "cookie"
                  - exact: "session-uuid"
                  - exact: "x-session-uuid"
                  - exact: "x-session-id"
                  - exact: "user-agent"
                  - exact: "x-forwarded-for"
                  - exact: "x-real-ip"
                  - exact: "host"
          
          # 3. gRPC JSON Transcoder - ТРЕТИЙ, после авторизации
          # Транскодирует HTTP↔gRPC для InventoryService
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              proto_descriptor: "/etc/envoy/proto/inventory/v1/inventory_descriptor.pb"
              services: ["inventory.v1.InventoryService"]
              # match_incoming_request_route: false (по умолчанию) - транскодер применяется ко всем запросам
              # Транскодер автоматически сопоставляет пути из proto с путями запроса
              # После regex_rewrite путь /inventory/v1/parts:list становится /v1/parts:list,
              # что совпадает с путем в proto, поэтому транскодер должен работать
              print_options:
                add_whitespace: true
                always_print_primitive_fields: true
                always_print_enums_as_ints: false
                preserve_proto_field_names: true
              ignore_unknown_query_parameters: true
          
          # 4. Router фильтр - ОБЯЗАТЕЛЬНО ПОСЛЕДНИЙ
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ===============================
  # CLUSTERS
  # ===============================
  clusters:
  
  # ===============================
  # ORDER HTTP SERVICE CLUSTER
  # ===============================
  - name: order_http_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/1.1 для HTTP сервиса
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}
    
    # Circuit breaker для защиты от перегрузки
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100
        max_pending_requests: 200
        max_requests: 1000
        max_retries: 3
    
    # Health checking
    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health"
    
    # Endpoint Order HTTP сервиса
    load_assignment:
      cluster_name: order_http_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: order-http-server  # Docker service name
                port_value: 8080            # HTTP порт Order сервиса (из переменной HTTP_PORT)

  # ===============================
  # INVENTORY gRPC SERVICE CLUSTER
  # ===============================
  - name: inventory_grpc_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 обязательно для gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    
    # Circuit breaker для защиты от перегрузки
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 50
        max_pending_requests: 100
        max_requests: 1000
        max_retries: 3
    
    # Health checking для gRPC сервиса
    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      grpc_health_check:
        service_name: "inventory.v1.InventoryService"
    
    # Endpoint Inventory gRPC сервиса
    load_assignment:
      cluster_name: inventory_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: inventory-grpc-server  # Docker service name
                port_value: 50051               # gRPC порт Inventory сервиса (из переменной GRPC_PORT)

  # ===============================
  # IAM gRPC SERVICE CLUSTER (для External Authorization)
  # ===============================
  - name: iam_grpc_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 обязательно для gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
    
    # Connection pooling для производительности
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 10
        max_pending_requests: 50
        max_requests: 100
        max_retries: 3
        track_remaining: true
    
    # Настройки соединений
    upstream_connection_options:
      tcp_keepalive:
        keepalive_probes: 3
        keepalive_time: 30
        keepalive_interval: 5
    
    # Health checking для IAM сервиса
    health_checks:
    - timeout: 1s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check:
        service_name: "iam.v1.IAMService"
    
    # Endpoint IAM gRPC сервиса
    load_assignment:
      cluster_name: iam_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-grpc-server  # Docker service name
                port_value: 50053         # gRPC порт IAM сервиса

# ===============================
# ПОТОК ОБРАБОТКИ ЗАПРОСА:
# ===============================
# 1. HTTP клиент → Envoy:8080/order/api/v1/orders (с Session-UUID)
# 2. HTTP Connection Manager парсит запрос
# 3. CORS фильтр добавляет CORS заголовки
# 4. ext_authz фильтр:
#    a) Извлекает session-uuid из заголовков
#    b) Отправляет gRPC CheckRequest в iam-grpc-server:50053
#    c) IAM сервис обрабатывает Check() → проверяет сессию
#    d) Возвращает CheckResponse с заголовками x-user-* и x-session-*
#    e) Envoy добавляет эти заголовки в запрос к Order/Inventory сервису
# 5. Для Inventory: grpc_json_transcoder преобразует HTTP → gRPC
# 6. Router направляет запрос в соответствующий кластер
# 7. Order/Inventory сервис получает запрос с информацией о пользователе
# 8. Обратный поток: ответ → JSON → HTTP клиент

# ===============================
# ВАЖНЫЕ ОСОБЕННОСТИ КОНФИГУРАЦИИ:
# ===============================
# 1. CORS фильтр должен быть ПЕРВЫМ в http_filters
# 2. ext_authz фильтр ДОЛЖЕН быть ДО grpc_json_transcoder
# 3. IAM сервис реализует интерфейс envoy.service.auth.v3.Authorization/Check
# 4. failure_mode_allow: false для безопасности (deny by default)
# 5. HTTP/2 обязательно для всех gRPC кластеров
# 6. Health checks для всех сервисов
# 7. Circuit breakers для защиты от перегрузок
# 8. Публичные эндпоинты (/v1/login, /v1/register, /healthz, /health) исключены из аутентификации
# 9. CORS настройки позволяют веб-приложениям обращаться к API
